<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>HTL Elevadores | Mantenimiento multimarca de ascensores y facility management en Lima</title>
  <meta name="description"
    content="Mantenimiento, reparación y modernización multimarca de ascensores, emergencias 24/7, limpieza profesional ProClean y aromatización de ambientes en Lima. Agende una visita diagnóstica sin cargo." />
  <meta name="theme-color" content="#0d0e10" />
  <script>
    // Set the theme before first paint so the page never flashes the wrong ground.
    (function () {
      try {
        var saved = localStorage.getItem('theme');
        var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.classList.toggle('dark', dark);
      } catch (e) { }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
